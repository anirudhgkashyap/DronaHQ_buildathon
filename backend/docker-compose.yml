version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: atlas_sdr
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_sdr"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://atlas:atlas_dev@db:5432/atlas_sdr
      CHANNELS_DRY_RUN: "true"
      SCHEDULER_ENABLED: "true"
      SCHEDULER_TICK_SECONDS: "60"
      # Fill in your real keys — leave blank to use the simulator
      DRONAHQ_BASE_URL: "${DRONAHQ_BASE_URL:-}"
      DRONAHQ_API_KEY: "${DRONAHQ_API_KEY:-}"
      DRONAHQ_AGENT_PROSPECT_GENERATION: "${DRONAHQ_AGENT_PROSPECT_GENERATION:-}"
      DRONAHQ_AGENT_RESEARCH_ENRICHMENT: "${DRONAHQ_AGENT_RESEARCH_ENRICHMENT:-}"
      DRONAHQ_AGENT_ICP_FIT: "${DRONAHQ_AGENT_ICP_FIT:-}"
      DRONAHQ_AGENT_OUTREACH_STRATEGIST: "${DRONAHQ_AGENT_OUTREACH_STRATEGIST:-}"
      DRONAHQ_AGENT_PERSONALISATION: "${DRONAHQ_AGENT_PERSONALISATION:-}"
      DRONAHQ_AGENT_REPLY_HANDLER: "${DRONAHQ_AGENT_REPLY_HANDLER:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    restart: on-failure

  seed:
    build: .
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://atlas:atlas_dev@db:5432/atlas_sdr
    command: ["python", "-m", "app.seed"]
    restart: "no"

volumes:
  pgdata:

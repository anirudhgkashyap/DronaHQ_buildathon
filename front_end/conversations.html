<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversations · Atlas SDR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-campaigns" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7Z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></symbol>
  <symbol id="i-bot" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M9 11V7a3 3 0 0 1 6 0v4"/><circle cx="9" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="16" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</svg>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar__top">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#3446d6"/><rect x="6" y="8" width="16" height="3" rx="1.5" fill="#fff"/><rect x="8.5" y="13.5" width="11" height="3" rx="1.5" fill="#fff"/><rect x="11" y="19" width="6" height="3" rx="1.5" fill="#fff"/></svg>
        <div><div class="brand__name">Atlas SDR</div><div class="brand__sub">Control plane</div></div>
      </div>
      <nav class="nav" aria-label="Main">
        <a class="nav__link" href="campaigns.html"><svg class="icon nav__icon"><use href="#i-campaigns"/></svg>Campaigns</a>
        <a class="nav__link nav__link--active" href="conversations.html" aria-current="page"><svg class="icon nav__icon"><use href="#i-inbox"/></svg>Conversations<span class="nav__badge" data-badge="approvals" aria-label="pending approvals"></span></a>
        <a class="nav__link" href="settings.html"><svg class="icon nav__icon"><use href="#i-settings"/></svg>Global settings</a>
      </nav>
    </div>
    <div class="ks" data-killswitch>
      <div class="ks__title" data-ks-title>Global kill switch</div>
      <p class="ks__text" data-ks-text>Stops every agent on every campaign and channel.</p>
      <button type="button" class="btn btn--danger btn--sm" data-ks-button>Stop all activity</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1>Conversations</h1>
      <div class="topbar__actions"><span class="avatar" data-user-avatar title="Signed in" aria-hidden="true"></span></div>
    </header>
    <main class="content content--flush" id="content">
      <div data-slot="platform-banner"></div>
      <div class="inbox" id="inbox">
        <div class="inbox__list" id="inbox-list-pane">
          <div class="inbox__list-head">
            <label class="search search--full"><svg class="icon"><use href="#i-search"/></svg><input class="input" type="search" id="conv-search" placeholder="Search conversations" autocomplete="off"></label>
            <div class="filters filters--sm" id="conv-filters" role="group" aria-label="Filter conversations">
              <button class="filter filter--active" data-filter="all">All</button>
              <button class="filter" data-filter="active">Active</button>
              <button class="filter" data-filter="replied">Replied</button>
              <button class="filter" data-filter="unread">Unread</button>
              <button class="filter" data-filter="approvals">Approvals</button>
            </div>
          </div>
          <ul class="conv-list" id="conv-list" aria-label="Conversations"></ul>
          <div id="conv-list-state" aria-live="polite"></div>
        </div>
        <div class="inbox__thread" id="inbox-thread-pane">
          <button class="btn btn--ghost btn--sm inbox__back" id="inbox-back" hidden><svg class="icon"><use href="#i-back"/></svg>All conversations</button>
          <div class="inbox__empty" id="thread-empty"><svg class="icon icon--lg" aria-hidden="true"><use href="#i-inbox"/></svg><p>Select a conversation to view the thread.</p></div>
          <div class="thread" id="thread-content" hidden>
            <div class="thread__header" id="thread-header"></div>
            <div class="thread__messages" id="thread-messages" role="log" aria-live="polite" aria-label="Message thread"></div>
            <div class="thread__ai" id="thread-ai">
              <div class="thread__ai-head"><svg class="icon"><use href="#i-bot"/></svg><span>AI suggestions</span><button class="btn btn--ghost btn--xs" id="refresh-suggestions">Refresh</button></div>
              <ul class="ai-suggestions" id="ai-suggestions"></ul>
            </div>
            <div class="thread__compose" id="thread-compose">
              <div class="compose">
                <div class="compose__to-row">
                  <span class="compose__label">To:</span>
                  <span class="compose__to" id="compose-to"></span>
                  <select class="select select--sm" id="compose-channel"><option value="email">Email</option><option value="linkedin">LinkedIn</option><option value="sms">SMS</option></select>
                </div>
                <textarea class="compose__body" id="compose-body" rows="4" placeholder="Write your reply…"></textarea>
                <div class="compose__actions">
                  <button type="button" class="btn btn--ghost btn--sm" id="ai-fill-btn"><svg class="icon"><use href="#i-bot"/></svg>AI draft</button>
                  <button type="button" class="btn btn--primary btn--sm" id="send-btn"><svg class="icon"><use href="#i-send"/></svg>Send</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/config.js" defer></script>
<script src="js/mock-data.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/shell.js" defer></script>
<script src="js/conversations.js" defer></script>
</body>
</html>
